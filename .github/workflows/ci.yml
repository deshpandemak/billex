name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDr8Jju07lU2JfY0FLfEdmXzy_5tYgJHro
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: billex-556a4.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: billex-556a4
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: billex-556a4.firebasestorage.app
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "142988257091"
  NEXT_PUBLIC_FIREBASE_APP_ID: "1:142988257091:web:389981f16278cafef6b1f6"

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build

  unit-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx vitest run tests/unit
      - name: Start dev server
        run: nohup npm run dev -- --port 3000 > dev-server.log 2>&1 &
      - name: Wait for dev server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/login > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready in time" >&2
          exit 1
      - run: npx vitest run tests/integration
      - if: failure()
        run: cat dev-server.log

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
