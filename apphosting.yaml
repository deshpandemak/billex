# Firebase App Hosting configuration.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 2

env:
  # Client-side Firebase config (safe to expose in the browser bundle).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDr8Jju07lU2JfY0FLfEdmXzy_5tYgJHro
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: billex-556a4.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: billex-556a4
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: billex-556a4.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "142988257091"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:142988257091:web:389981f16278cafef6b1f6"
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: billex-556a4
    availability:
      - RUNTIME

  # Secrets: set these with `firebase apphosting:secrets:set <NAME>` (see
  # deployment steps) — do not put real values here, this file is committed.
  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    secret: FIREBASE_ADMIN_CLIENT_EMAIL
    availability:
      - RUNTIME
  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: FIREBASE_ADMIN_PRIVATE_KEY
    availability:
      - RUNTIME
